[package]
name = "home-camera"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time", "process", "signal", "net", "io-util"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
anyhow = "1.0"
tokio-util = { version = "0.7", features = ["io"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
nix = { version = "0.30", features = ["signal"] }
axum = "0.8.8"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "json", "migrate", "macros"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
