# GitHub Actions workflow for home-camera
# Latest-tag strategy (no semantic version auto-increment)

name: Build and Push to Harbor - home-camera

on:
  # 手動実行はテストとビルドのみ。公開は main への push で実行する。
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: harbor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # fmt・clippy・cargo-audit。rust-toolchain.toml の版で実行し、指摘があれば publish しない。
  verify:
    uses: home-lab-ksera/home-lab-k8s/.github/workflows/rust-verify.yml@main

  recovery-tests:
    uses: ./.github/workflows/state-tests.yml

  publish:
    needs: [recovery-tests, verify]
    uses: home-lab-ksera/home-lab-k8s/.github/workflows/publish-harbor.yml@main
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      image_name: home-camera
